[package]
name = "poem-react-ts"
version = "0.0.0"
edition = "2021"

[workspace]
members = ["codec"]

[[bin]]
name = "server"
path = "server.rs"

[dependencies]
codec = { path = "codec" }
http-body-util = "0.1.0-rc.2"
hyper = { version = "1.0.0-rc.3", features = ["http1", "server"] }
lazy_static = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }

[build-dependencies]
wasmql-build = { path = "../../wasmql-build" }
