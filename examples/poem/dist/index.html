<!DOCTYPE html>
<html>
    <head>
        <title>WasmQL demo</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles.css">

        <ul id="items"></ul>

        <div>
            <input id="new-name">
            <input id="new-desc">
            <button onclick="createItem()">New Item</button>
        </div>
    </head>
    <body>
        <script type="module">
            import wasmql from '/wasmql.min.js';

            let codec = await wasmql({
                endpoint: '/wasmql',
                wasm: '/codec.wasm',
            });

            function appendItem(item) {
                let li = document.createElement("li");
                li.className = "item";
                li.html = `
                    <h1>${item.name}</h1>
                    <p>${item.desc}</p>
                    <input
                        id="item-${item.id}"
                        type="checkbox" 
                        ${item.done ? "checked": ""}
                        onclick="markDone(${item.id})"
                    >
                `;
                document.querySelector("#items").appendChild(li);
            }

            async function markDone(id) {
                let check_box = document.querySelector(`#item-${id}`);
                if (!check_box.checked) {
                    check_box.checked = true;
                } else {
                    await codec.mark_done(id);
                }
            }

            async function createItem() {
                let name = document.querySelector("new-name");
                let desc = document.querySelector("new-desc");
                let item = await codec.create_item(name.value, name.desc);
                name.value = "";
                desc.value = "";
                appendItem(item);
            }

            (await codec.items()).forEach(item => appendItem(item));
        </script>
    </body>
</html>
