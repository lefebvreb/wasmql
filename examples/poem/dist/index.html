<!DOCTYPE html>
<html>
    <head>
        <title>WasmQL Demo</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="styles.css">

        <ul id="items"></ul>

        <div>
            <input id="new-name">
            <input id="new-desc">
            <button id="create-item">New Item</button>
        </div>
    </head>
    <body>
        <script type="module">
            import wasmql from '/wasmql.js';

            function appendItem(item) {
                let li = document.createElement("li");
                li.className = "item";
                li.html = `
                    <h1>${item.name}</h1>
                    <p>${item.desc}</p>
                    <input
                        id="item-${item.id}"
                        type="checkbox" 
                        ${item.done ? "checked": ""}
                        onclick="markDone(${item.id})"
                    >
                `;
                document.getElementById("items").append(li);
            }

            async function markDone(id) {
                let check_box = document.getElementById(`item-${id}`);
                if (!check_box.checked) {
                    check_box.checked = true;
                } else {
                    await codec.mark_done(id);
                }
            }

            async function createItem() {
                let name = document.getElementById("new-name");
                let desc = document.getElementById("new-desc");
                let item = await codec.create_item(name.value, desc.value);
                name.value = "";
                desc.value = "";
                appendItem(item);
            }

            document.getElementById("create-item").onclick = createItem;

            let codec = await wasmql({
                endpoint: '/wasmql',
                wasm: '/codec.wasm',
            });

            (await codec.items()).forEach(item => appendItem(item));
        </script>
    </body>
</html>
