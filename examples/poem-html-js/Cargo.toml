[package]
name = "hyper-html-js"
version = "0.0.0"
edition = "2021"

[workspace]
members = ["my-codec"]

[dependencies]
my-codec = { path = "my-codec" }
poem = { version = "1", features = ["static-files"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
wasmql-build = { path = "../../wasmql-build" }
