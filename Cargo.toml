[package]
name = "wasmql"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "wasmql-build",
    "wasmql-macros",
]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "doc_cfg"]

[features]
wasm-backend = []

[dependencies]
postcard = { version = "1", features = ["alloc"], default-features = false }
serde = { version = "1", features = ["derive"], default-features = false }
wasmql-macros = { path = "wasmql-macros" }

