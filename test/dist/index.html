<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>WasmQL Demo</title>
    </head>
    <body>
        <script type="module">
            import wasmql from "/wasmql-copy.js";

            const UTF8_TEST = "~𝘈Ḇ𝖢𝕯٤ḞԍНǏ𝙅ƘԸⲘ𝙉০Ρ𝗤Ɍ𝓢ȚЦ𝒱Ѡ𝓧ƳȤѧᖯć𝗱ễ𝑓𝙜Ⴙ𝞲𝑗𝒌ļṃŉо𝞎𝒒ᵲꜱ𝙩ừ𝗏ŵ𝒙𝒚ź1234567890!@#$%^&*()-_=+[{]};:'\",<.>/?";

            const DATA = {
                int: -8265628,
                // float: 42.42,
                // string: UTF8_TEST,
                // record: {
                //     k: "key",
                //     v: 42,
                // },
                //new_type: 10000000,
            };

            let codec = await wasmql({
                endpoint: "/wasmql",
                wasm: "/codec.wasm",
            });

            let data = await codec.echo(DATA);

            console.assert(data == DATA, "mismatch", data, DATA);
        </script>
    </body>
</html>
