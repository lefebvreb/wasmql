<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>WasmQL Test</title>
        <script src="./lodash.js"></script>
    </head>
    <body>
        <h1>Check the console!</h1>
        <p>No red means OK</p>
        
        <script type="module">
            import wasmql from "/wasmql.js";

            const UTF8_TEST = "~𝘈Ḇ𝖢𝕯٤ḞԍНǏ𝙅ƘԸⲘ𝙉০Ρ𝗤Ɍ𝓢ȚЦ𝒱Ѡ𝓧ƳȤѧᖯć𝗱ễ𝑓𝙜Ⴙ𝞲𝑗𝒌ļṃŉо𝞎𝒒ᵲꜱ𝙩ừ𝗏ŵ𝒙𝒚ź1234567890!@#$%^&*()-_=+[{]};:'\",<.>/?";

            const TEST_DATA = {
                unit: undefined,
                boolean: true,
                int: -8265628,
                float: 42.0,
                chr: '$',
                string: UTF8_TEST,
                opt_some: -12,
                opt_none: null,
                tup: [7, "7"],
                arr: [true, false, true, false],
                record: { k: "key", v: 42 },
                new_type: 10000000,
                enum_unit: "UnitVariant",
                enum_new_type: { "NewTypeVariant": "john" },
                enum_tup: { "TupleVariant": [1.0, "0.0", -1.0] },
                enum_struct: { "StructVariant": { a: 1, b: 2, c: 3 } },
                map: { "x": 16, "y": 32, "z": 64 },
                bytes: [1, 2, 3, 4, 5],
            };

            let codec = await wasmql({
                endpoint: "/wasmql",
                wasm: "/codec.wasm",
            });

            let data = await codec.echo(TEST_DATA);

            console.assert(_.isEqual(data, TEST_DATA), "mismatch");
            console.log("sent:", JSON.stringify(TEST_DATA));
            console.log("received:", JSON.stringify(data));
        </script>
    </body>
</html>
